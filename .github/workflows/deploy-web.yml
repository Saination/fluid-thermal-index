name: Deploy web calculator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/countries.json"
      - "data/fluids.json"
      - "data/sources.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy data files into web directory
        run: |
          cp data/countries.json web/countries.json
          cp data/fluids.json    web/fluids.json
          cp data/sources.json   web/sources.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
